
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadpad Export</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.5.0/css/all.css">
<style>
    /* CSS */
html,
body {
    background: #111;
    color: white;
    width: 100vw;
    height: 100vh;
    padding: 0;
    margin: 0;
    overflow-x: hidden;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}

.col-layout {
    display: flex;
    width: 100%;
    flex-direction: column;
}

.col-item {
    width: 100%;
    padding: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.nav-top {
    height: 30px;
    position: fixed;
    width: 100%;
    top: 0px;
    left: 0px;
    margin: 0;
    background: #00000040;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
}

.col-sep-bottom {
    border-bottom: 1px solid #333;
}

.header-1 {
    background-image: url("https://occulto.quest/images/art_1.webp");
    height: 300px;
    background-position: 50%;
    z-index: 1;
}

.header-1>img {
    width: 500px;
}

.post {
    width: calc(80% - 5px);
    max-height: calc(200px - 5px);
    cursor: pointer;
    overflow: hidden;
    background-color: #222;
    border: 1px solid #414141;
    border-radius: 6px;
    padding: 10px;
    position: relative;
    margin: 10px 0px;
}

.posts-container.hide-posts .post {
    display: none;
}

.posts-container>h2 {
    user-select: none;
}

.posts-container>h2>i {
    font-size: 20px;
    cursor: pointer;
}

.post:not(.active):after {
    content: '';
    position: absolute;
    left: 0px;
    right: 0px;
    height: 40%;
    bottom: 0px;
    background: linear-gradient(180deg, rgba(139, 167, 32, 0) 0%, #222 100%);
    pointer-events: none;
}

.post>span {
    display: block;
}

.post.active {
    max-height: 250px;
    overflow-y: scroll;
    background: #333;
}

table {
    background-color: #242424;
    border: 1px solid #707070;
    border-radius: 6px;
    padding: 4px;
    position: relative;
    cursor: default;
}

tbody {
    position: relative;
}

tbody::after {
    content: "";
    width: 100%;
    height: 1px;
    position: absolute;
    top: 0;
    left: 0;
    background: #707070;
}

td {
    padding: 2px;
}

@media only screen and (max-width: 700px) {
    .header-1>img {
        width: 100vw;
    }
    .header-1>big {
        font-size:5vw;
    }
    .post {
        width: calc(100% - 40px);
    }
    table {
        font-size: small;
    }
}
</style>
</head>
<body>
<div class="nav-top">
    <i class="fa-solid fa-shield-check"></i>
    developer.occulto.quest
</div>
<div class="col-layout">
    <div class="col-item header-1 col-sep-bottom">
        <img src="https://github.com/OccultoStudios/OccultoStudios.github.io/blob/main/ooccultodeveloper.png?raw=true" alt="">
        <big>The official developer guide for Occulto.</big>
    </div>
    <div class="col-item col-sep-bottom posts-container">
        <h2>Posts <i class="fa-solid fa-eye"></i></h2>
    </div>
</div>
<script type="text/javascript">
    function setupPost(post) {
    post.addEventListener('click', () => {
        post.classList.toggle('active');
    });
    const links = post.querySelectorAll('a');
    links.forEach(link => {
        link.target = "_new";
    })
}
document.title = "Occulto Developer";
const postsContainer = document.querySelector('.posts-container');
const postsToggle = document.querySelector('.posts-container > h2 > .fa-solid');
async function getPosts() {
    const URL = "https://raw.githubusercontent.com/OccultoStudios/OccultoStudios.github.io/refs/heads/main/posts.json";
    const res = await fetch(URL);
    const data = await res.json();

    data.forEach(async post => {
        const postElement = document.createElement('div');
        postElement.className = "post";
        const postTitle = document.createElement('b');
        postTitle.innerText = post.title;
        postElement.appendChild(postTitle);
        const postContent = document.createElement('span');
        var content = post.desc;
        if(content.startsWith('!GetData')) {
            const url = content.split("!GetData ")[1];
            const new_data = await fetch(url);
            const str = await new_data.text();
            postContent.innerHTML = str;
        } else {
            postContent.innerHTML = content;
        }
        
        postElement.appendChild(postContent);
        postsContainer.appendChild(postElement);
        setupPost(postElement);
    })
}
getPosts();

postsToggle.addEventListener('click', ()=>{
    postsToggle.classList.toggle("fa-eye-low-vision");
    postsToggle.classList.toggle("fa-eye");
    postsContainer.classList.toggle('hide-posts');
});
</script>
    
</body>
</html>
